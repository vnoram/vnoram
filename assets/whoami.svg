<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="bitacora de inmersion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04141c"/><stop offset="1" stop-color="#010609"/></linearGradient>
    <style>
      .m{font-family:'JetBrains Mono','Consolas','Courier New',monospace;font-size:16px}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      @keyframes flick{0%,90%,100%{opacity:1}93%{opacity:.35}96%{opacity:.8}}
      @keyframes ping{0%{r:2;opacity:.9}100%{r:26;opacity:0}}
      .c{animation:blink 1s steps(2,end) infinite}
      .f{animation:flick 6s infinite}
      .p{animation:ping 3.2s ease-out infinite}
    </style>
  </defs>
  <rect width="960" height="270" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="268" fill="none" stroke="#2fe0c8" stroke-opacity="0.35"/>
  <rect x="1" y="1" width="958" height="30" fill="#07222b"/>
  <circle cx="22" cy="16" r="5" fill="#ff4d3d"/><circle cx="42" cy="16" r="5" fill="#2a4a52"/><circle cx="62" cy="16" r="5" fill="#2a4a52"/>
  <text class="m" x="90" y="21" font-size="13" fill="#6fb9b3">bitacora://inmersion-0417 · transmision inestable</text>

  <text class="m" x="24" y="68"  fill="#2fe0c8">buzo@nautilus:~$ <tspan fill="#cfeeea">whoami</tspan></text>
  <text class="m" x="24" y="96"  fill="#cfeeea">Victor Leandro Norambuena Orellana · Chile</text>
  <text class="m" x="24" y="130" fill="#2fe0c8">buzo@nautilus:~$ <tspan fill="#cfeeea">cat bitacora.txt</tspan></text>
  <text class="m" x="24" y="158" fill="#6fb9b3">&gt; construyo software, lo despliego en la nube y lo dejo seguro.</text>
  <text class="m f" x="24" y="180" fill="#b78cff">&gt; Me metí demasiado profundo, una parte de mí sigue ahí abajo... nadando...</text>
  <text class="m" x="24" y="202" fill="#6fb9b3">&gt; proyecto activo: Geo-Constanza (geocercas + BI).</text>
  <text class="m" x="24" y="238" fill="#2fe0c8">buzo@nautilus:~$ <tspan class="c" fill="#cfeeea">█</tspan></text>

  <!-- sonar -->
  <g transform="translate(850 150)">
    <circle r="62" fill="none" stroke="#2fe0c8" stroke-opacity="0.25"/>
    <circle r="38" fill="none" stroke="#2fe0c8" stroke-opacity="0.2"/>
    <circle r="14" fill="none" stroke="#2fe0c8" stroke-opacity="0.2"/>
    <circle class="p" r="2" fill="none" stroke="#2fe0c8"/>
    <circle cx="26" cy="-30" r="4" fill="#ff4d3d" class="c"/>
    <circle cx="-8" cy="8" r="2.5" fill="#2fe0c8"/>
  </g>
</svg>
