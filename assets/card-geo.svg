<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 180" width="310" height="180" role="img" aria-label="Geo-Constanza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06202a"/><stop offset="1" stop-color="#010609"/></linearGradient>
    <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#00D2C4" stop-opacity=".25"/><stop offset="1" stop-color="#00D2C4" stop-opacity="0"/></radialGradient>
    <style>
      .m{font-family:'JetBrains Mono','Consolas','Courier New',monospace}
      @keyframes ping{0%{r:2.5;opacity:.9}100%{r:13;opacity:0}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      .p{animation:ping 2.8s ease-out infinite}
      .b{animation:blink 1.6s steps(2,end) infinite}
    </style>
  </defs>
  <rect width="310" height="180" fill="url(#bg)"/>
  <rect width="310" height="180" fill="url(#g)"/>
  <rect x="1" y="1" width="308" height="178" fill="none" stroke="#12b8ad" stroke-opacity=".4"/>
  <path d="M1 16 V1 H16 M294 1 H309 V16 M309 164 V179 H294 M16 179 H1 V164" fill="none" stroke="#2fe0c8" stroke-width="2"/>
  <text class="m" x="20" y="26" font-size="10" fill="#2fe0c8" fill-opacity=".8" letter-spacing="2">EXPEDICIÓN 01 · -1200 m</text>
  <text class="m" x="20" y="54" font-size="17" font-weight="700" fill="#9fe8e0" textLength="135" lengthAdjust="spacingAndGlyphs">Geo-Constanza</text>
  <path d="M20 64 H290" stroke="#12b8ad" stroke-opacity=".3"/>
  <text class="m" x="20" y="86" font-size="12" fill="#8fc9c3">Gestión operativa y monitoreo</text><text class="m" x="20" y="103" font-size="12" fill="#8fc9c3">espacial con geocercas para</text><text class="m" x="20" y="120" font-size="12" fill="#8fc9c3">personal de seguridad, con BI.</text>
  <rect x="20" y="132" width="88" height="20" rx="3" fill="#06222b" stroke="#12b8ad" stroke-opacity=".5"/><text class="m" x="64" y="146" font-size="11" fill="#9fe8e0" text-anchor="middle">JavaScript</text><rect x="116" y="132" width="81" height="20" rx="3" fill="#06222b" stroke="#12b8ad" stroke-opacity=".5"/><text class="m" x="156" y="146" font-size="11" fill="#9fe8e0" text-anchor="middle">Geocercas</text><rect x="205" y="132" width="29" height="20" rx="3" fill="#06222b" stroke="#12b8ad" stroke-opacity=".5"/><text class="m" x="219" y="146" font-size="11" fill="#9fe8e0" text-anchor="middle">BI</text>
  <text class="m" x="20" y="170" font-size="9" fill="#6fb9b3" fill-opacity=".7">ÚLTIMA SEÑAL 09/2026</text>
  <g transform="translate(284 24)">
    <circle class="p" r="2.5" fill="none" stroke="#ff4d3d"/>
    <circle r="3" fill="#ff4d3d" class="b"/>
  </g>
</svg>
